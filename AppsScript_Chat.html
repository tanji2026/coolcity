<!doctype html><html lang="zh-Hant"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,"Noto Sans TC",sans-serif;color:#24392d;background:#fff}.head{background:#edf6ef;padding:12px 16px;font-weight:700}.log{height:260px;overflow:auto;padding:14px;white-space:pre-wrap}.bubble{padding:9px 12px;border-radius:12px;margin:0 0 10px;background:#f1f5f2}.mine{background:#e1f0e6}form{display:flex;gap:6px;padding:10px;border-top:1px solid #ddd}input{min-width:0;flex:1;padding:10px;border:1px solid #ccd5cd;border-radius:8px}button{background:#236743;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.5}.note{font-size:12px;color:#647568;padding:0 12px 8px}
</style></head><body><div class="head">🌱 小樹苗 · CoolCity AI 小幫手</div><div class="log" id="log" aria-live="polite"><div class="bubble">嗨！我是小樹苗。登入 CoolCity 後，就可以問我問題。</div></div><form id="f"><input id="q" maxlength="1200" placeholder="輸入問題…" aria-label="詢問小樹苗" required><button id="send">送出</button></form><div class="note" id="status">等待會員登入驗證 · 每位會員每日最多 20 次</div><script>
let token='';const log=document.getElementById('log'),status=document.getElementById('status'),send=document.getElementById('send');
// Only trust tokens sent by the CoolCity website, not arbitrary embedding sites.
const origins=['https://tanji.tw','https://www.tanji.tw','https://tanji2026.github.io'];
window.parent.postMessage({type:'coolcity-ready'},'*');const readyInterval=setInterval(()=>{if(!token)window.parent.postMessage({type:'coolcity-ready'},'*');else clearInterval(readyInterval);},1500);
window.addEventListener('message',e=>{if(!origins.includes(e.origin)||!e.data||e.data.type!=='coolcity-auth')return;token=typeof e.data.token==='string'?e.data.token:'';status.textContent=token?'已登入 · 每日最多 20 次':'請先登入 CoolCity 會員';});
function add(t,mine){const el=document.createElement('div');el.className='bubble'+(mine?' mine':'');el.textContent=t;log.append(el);log.scrollTop=log.scrollHeight;}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();if(!token){add('請先到會員中心登入，再使用小樹苗。');return;}const q=document.getElementById('q');const value=q.value.trim();if(!value)return;add(value,true);q.value='';send.disabled=true;status.textContent='小樹苗正在思考…';google.script.run.withSuccessHandler(answer=>{add(answer);send.disabled=false;status.textContent='已登入 · 每日最多 20 次';}).withFailureHandler(err=>{add(err&&err.message?err.message:'暫時無法回答，請稍後再試。');send.disabled=false;status.textContent='請稍後再試';}).askSeedling(value,token);});
</script></body></html>
